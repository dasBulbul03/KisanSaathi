# nginx config for the built frontend.
#
# Two jobs: serve the SPA, and hand anything under /api or the health probes to
# the backend container so the browser only ever talks to one origin. Single
# origin matters here because the API uses bearer tokens held in localStorage —
# a cross-origin setup would put the app and the API on different origins with
# CORS and cookie rules in between for no benefit.
#
# This file is included from the http block, so only http-level directives are
# allowed here. The main config in nginxinc/nginx-unprivileged already puts the
# pid file and the temporary directories under /tmp, which is what lets the
# process run as uid 101 instead of root.

server {
    # 8080, not 80: the container runs as the unprivileged `nginx` user, and a
    # non-root process cannot bind a port below 1024. The host port in
    # docker-compose.yml is what users actually see.
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Uploads and probe endpoints belong to the backend.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location = /health {
        proxy_pass http://backend:8000/health;
        proxy_set_header Host $host;
    }

    location = /ready {
        proxy_pass http://backend:8000/ready;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://backend:8000/openapi.json;
        proxy_set_header Host $host;
    }

    # Hashed asset filenames are immutable, so they can be cached hard.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        # One Cache-Control, not two: `expires` would emit max-age alongside the
        # add_header below, and a duplicated header is read differently by
        # different caches.
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html must never be cached, or a deploy leaves stale asset URLs
    # pointing at files that no longer exist.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Client-side routing: unknown paths are React Router's problem, not nginx's.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # The default nginx body size is 1 MB, which a lot photo can exceed.
    client_max_body_size 12m;

    # Inherited by every location that does not set its own add_header. The two
    # locations above include the same file directly, because a location's own
    # add_header replaces the inherited set rather than adding to it.
    include /etc/nginx/security-headers.conf;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

}
