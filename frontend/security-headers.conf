# Security headers, kept in their own file so they can be included wherever a
# location sets its own `add_header`.
#
# nginx does not merge add_header directives across levels: a location that adds
# one header silently drops every header it would otherwise inherit. Serving the
# SPA through `location = /index.html` therefore loses the server-level set
# unless each such location includes these lines itself, which is exactly what
# this file is for.

add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
