# Alembic configuration for KisanSaathi.
#
# The database URL is intentionally absent. alembic/env.py sets it from
# app.core.config, so migrations always target the same database as the app
# instead of a copy-pasted URL that silently goes stale.
#
#   alembic upgrade head
#   alembic revision --autogenerate -m "add foo"
#   alembic downgrade -1

[alembic]
script_location = alembic
prepend_sys_path = .
file_template = %%(year)d%%(month).2d%%(day).2d_%%(hour).2d%%(minute).2d_%%(rev)s_%%(slug)s
version_path_separator = os
# Alembic's own log output. The application configures structlog separately.
sqlalchemy.url =

# No post_write_hooks: ruff is installed as a binary rather than a
# console_scripts entrypoint in this environment, so an exec hook would fail
# every revision. Run `ruff format .` instead; CI checks it.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
