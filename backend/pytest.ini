[pytest]
testpaths = tests
# The app package sits next to the tests and is not installed anywhere, so pytest
# has to be told to import it from here. Without this, `pytest -q` fails with
# `No module named 'app'` and the obvious fix, PYTHONPATH=., has to be rediscovered
# in every shell.
pythonpath = .
python_files = test_*.py
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -ra
filterwarnings =
    error::DeprecationWarning:app.*
    ignore::DeprecationWarning:python_jose.*
    ignore::DeprecationWarning:jose.*

[coverage:run]
source = app
branch = true

[coverage:report]
show_missing = true
skip_covered = false
exclude_lines =
    pragma: no cover
    if TYPE_CHECKING:
    raise NotImplementedError
    \.\.\.

# Ruff settings live in ruff.toml. They were duplicated here originally, but
# ruff does not read pytest.ini, so this block was dead config.
